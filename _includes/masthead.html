{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"><span class="lang-en">{{ link.title }}</span><span class="lang-pt">{{ link.title_pt | default: link.title }}</span></a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <div class="lang-switcher" role="group" aria-label="Language switcher">
        <button type="button" class="lang-switcher__btn" data-set-lang="en" title="English">EN</button>
        <span class="lang-switcher__sep" aria-hidden="true">|</span>
        <button type="button" class="lang-switcher__btn" data-set-lang="pt" title="Português">PT</button>
      </div>
    </div>
  </div>
</div>
